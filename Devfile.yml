schemaVersion: 2.2.2
metadata:
  name: datagrid-workshop
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9@sha256:cca6cbf5adcb5ce83392795573fe258d468568bddc3ad3618297e9e6234cfb79
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      cpuLimit: '2'
      cpuRequest: '1'
      memoryLimit: 6G
      memoryRequest: 4G
      mountSources: true
  - name: m2
    volume:
      size: 1G