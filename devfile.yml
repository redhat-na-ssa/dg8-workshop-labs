schemaVersion: 2.2.2
metadata:
  name: datagrid-workshop
projects:
  - name: dg8-workshop-labs
    git:
      remotes:
        origin: 'https://github.com/redhat-na-ssa/dg8-workshop-labs.git'
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9@sha256:cca6cbf5adcb5ce83392795573fe258d468568bddc3ad3618297e9e6234cfb79
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      cpuLimit: '2'
      cpuRequest: '1'
      memoryLimit: 6G
      memoryRequest: 4G
      mountSources: true
    endpoints:
    - name: instance-1
      targetPort: 8080
      exposure: public 
    - name: instance-2
      targetPort: 8081
      exposure: public       
  - name: m2
    volume:
      size: 1G
commands:
  - id: run first instance
    exec:
      component: tools
      commandLine: 'mvn clean spring-boot:run'
      workingDir: "${PROJECTS_ROOT}/dg8-workshop-labs/dg8-spring-session"

  - id: run second instance
    exec:
      component: tools
      commandLine: 'mvn clean spring-boot:run -Dspring-boot.run.arguments="--server.port=8081"'
      workingDir: "${PROJECTS_ROOT}/dg8-workshop-labs/dg8-spring-session"               